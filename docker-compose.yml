services:
  vrising:
    container_name: vrising
    image: trueosiris/vrising
    environment:
      - TZ=America/New_York
      - SERVERNAME=Pokeru
      - UID=1001
      - GID=1001
      - WINEDLLOVERRIDES=winhttp=n,b
      - ENABLE_BEPINEX=true
      - ADMIN_STEAM_IDS=76561197996676121
    volumes:
      - '/home/steam/Vrising-Dedicated-Server/start.sh:/start.sh:ro'
      - '/home/steam/Vrising-Dedicated-Server/server:/mnt/vrising/server:rw'
      - '/home/steam/Vrising-Dedicated-Server/data:/mnt/vrising/persistentdata:rw'
    ports:
      - '9876:9876/udp'
      - '9877:9877/udp'
    restart: unless-stopped

