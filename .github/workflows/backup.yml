name: S3 Backup Pipeline

on:
  schedule:
    - cron: '0 7 * * *' # 7:00 AM UTC is 3:00 AM EST (New York)
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      prefix:
        description: 'S3 Folder Prefix (legacy or current)'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - legacy

jobs:
  backup:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run S3 Backup Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          AWS_S3_BUCKET: 'pokeru-games'
        run: |
          # Determine prefix (use manual input or default to current)
          PREFIX="${{ github.event.inputs.prefix }}"
          if [ -z "$PREFIX" ]; then
            PREFIX="current"
          fi
          
          # Install boto3 locally if needed (fallback)
          python3 -m pip install --break-system-packages boto3 || true
          
          # Execute the backup script
          python3 backup_to_s3.py "$PREFIX"
