name: Deploy V Rising Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Sync Config and Restart V Rising Server
        run: |
          mkdir -p /home/steam/Vrising-Dedicated-Server
          rm -rf /home/steam/Vrising-Dedicated-Server/compose.yaml /home/steam/Vrising-Dedicated-Server/start.sh
          cp docker-compose.yml /home/steam/Vrising-Dedicated-Server/docker-compose.yml
          cp start.sh /home/steam/Vrising-Dedicated-Server/start.sh
          chmod 755 /home/steam/Vrising-Dedicated-Server/start.sh
          cd /home/steam/Vrising-Dedicated-Server
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker builder prune -af || true
          docker image prune -af || true
          docker system prune -f || true
          sudo journalctl --vacuum-time=3d || true
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d
          sleep 40
          docker compose -f docker-compose.yml logs vrising --tail=300 > /tmp/vrising_docker.log 2>&1 || true
          cp /home/steam/Vrising-Dedicated-Server/data/wine_launch.log /tmp/wine_launch.log 2>/dev/null || true
          cp /home/steam/Vrising-Dedicated-Server/server/BepInEx/LogOutput.log /tmp/BepInEx_LogOutput.log 2>/dev/null || true
          chmod 666 /tmp/vrising_docker.log /tmp/wine_launch.log /tmp/BepInEx_LogOutput.log 2>/dev/null || true

